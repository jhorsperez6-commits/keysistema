<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub - Tu Key Generada</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #121316; border: 1px solid #2d3142; padding: 30px 20px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.7); }
        h1 { color: #00bfff; font-size: 22px; margin-bottom: 5px; font-weight: bold; }
        .subtitle { color: #00ff88; font-size: 13px; font-weight: bold; margin-bottom: 20px; }
        .key-box { background-color: #1a1c23; border: 1px dashed #00bfff; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .key-title { font-size: 12px; color: #aaa; margin-bottom: 8px; }
        .key-text { color: #00ff88; font-family: monospace; font-size: 17px; font-weight: bold; word-break: break-all; background: #0b0c10; padding: 12px; border-radius: 6px; border: 1px solid #333; }
        .btn { background: #00cc66; color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn:active { transform: scale(0.98); }
        .info { font-size: 11px; color: #8c91a0; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h1>SERVE PENE HUB</h1>
        <div class="subtitle">¡Anuncios Completados con Éxito!</div>

        <div class="key-box">
            <div class="key-title">Tu Key Única del Sistema:</div>
            <div class="key-text" id="assignedKey">Generando key...</div>
        </div>

        <button class="btn" onclick="copiarKey()">Copiar Key al Portapapeles</button>

        <div class="info">
            Esta key es única para ti y tiene una duración de <b>10 horas</b>.
        </div>
    </div>

    <script>
        // Banco masivo de keys únicas, locas y totalmente diferentes entre sí
        var masterKeys = [
            "X9mK-22pL-88qW", "Z7vB-44nT-11kM", "Q3wX-99aZ-55pL", "H8jN-33kK-77vC", "F2dL-66xX-44bN",
            "M5kP-11zZ-99wW", "T1qW-88mN-22bB", "K4xX-55vV-33cC", "L9zZ-22pP-66xX", "P6bB-77qQ-11mM",
            "V3nX-44kK-88zZ", "R8mN-11wW-55pP", "J2vV-99xX-77bB", "C7kK-33zZ-22qQ", "N5pP-66mM-44wW",
            "G1wW-55bB-88xX", "D4qQ-22vV-99kK", "B9zZ-77mM-11pP", "S6xX-11kK-33wW", "W2mN-88pP-55bB",
            "AX7-992-BNC",     "ZX9-411-KLP",     "QWE-778-ZZX",     "POI-332-MNB",     "LKJ-556-VCF",
            "HGF-884-XDS",     "REW-119-QAZ",     "TYU-663-WSX",     "JKL-225-EDC",     "VBN-447-RFV",
            "MKI-998-TGB",     "OIK-774-YHN",     "UYT-331-UJM",     "TRE-552-IKL",     "WQA-116-OPU",
            "ZXC-669-YTR",     "ASD-883-REW",     "FGH-227-QWE",     "JKL-441-BNM",     "BNM-995-VCX",
            "ALPHA-77-Z",      "BETA-33-X",       "GAMMA-88-C",      "DELTA-11-V",      "OMEGA-55-B",
            "VIP-99-K-44",     "GOD-22-L-77",     "PRO-66-M-11",     "LUA-44-N-88",     "HUB-33-P-22",
            "Xtreme-991-Z",    "Ultra-442-X",     "Master-773-C",    "Elite-114-V",     "GodMode-555-B",
            "FastKey-886-N",   "Secure-227-M",    "Random-668-Q",    "Token-339-W",     "Access-110-E",
            "SP-991A-ZX",      "SP-882B-YX",      "SP-773C-XW",      "SP-664D-WV",      "SP-555E-VU",
            "TX-1234-ZZ",      "TX-2345-YY",      "TX-3456-XX",      "TX-4567-WW",      "TX-5678-VV",
            "KR-5544-AA",      "KR-6655-BB",      "KR-7766-CC",      "KR-8877-DD",      "KR-9988-EE",
            "NX-1020-FF",      "NX-3040-GG",      "NX-5060-HH",      "NX-7080-II",      "NX-9010-JJ"
        ];

        function obtenerKeyGenerada() {
            var savedKey = localStorage.getItem("sph_user_assigned_key");
            var expireTime = parseInt(localStorage.getItem("sph_user_expire") || "0");
            var currentTime = Date.now();

            // Si el usuario ya tiene una key activa que no ha vencido (10 horas), le entregamos la misma
            if (savedKey && expireTime && currentTime < expireTime) {
                return savedKey;
            }

            // Filtramos las keys usadas para no repetir
            var usadas = [];
            try {
                usadas = JSON.parse(localStorage.getItem("sph_keys_usadas") || "[]");
            } catch(e) { usadas = []; }

            var disponibles = masterKeys.filter(function(k) {
                return usadas.indexOf(k) === -1;
            });

            var selectedKey = "";
            if (disponibles.length > 0) {
                var randomIndex = Math.floor(Math.random() * disponibles.length);
                selectedKey = disponibles[randomIndex];
            } else {
                selectedKey = "KEY-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.floor(Math.random() * 8999 + 1000);
            }

            // Guardamos la asignación por 10 horas (36,000,000 milisegundos)
            usadas.push(selectedKey);
            localStorage.setItem("sph_keys_usadas", JSON.stringify(usadas));
            localStorage.setItem("sph_user_assigned_key", selectedKey);
            localStorage.setItem("sph_user_expire", currentTime + 36000000);

            return selectedKey;
        }

        // Ejecutar de inmediato al cargar la pantalla
        document.getElementById("assignedKey").innerText = obtenerKeyGenerada();

        function copiarKey() {
            var keyText = document.getElementById("assignedKey").innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(keyText).then(function() {
                    alert("¡Key copiada al portapapeles!");
                });
            } else {
                alert("Tu key es: " + keyText);
            }
        }
    </script>
</body>
</html>
