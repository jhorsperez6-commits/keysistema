<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub - Tu Key</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0b0c10; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #121316; border: 1px solid #2d3142; padding: 30px 20px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { color: #00bfff; font-size: 20px; margin-bottom: 5px; }
        .key-box { background: #1a1c23; border: 1px dashed #00bfff; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .key-text { color: #00ff88; font-family: monospace; font-size: 16px; font-weight: bold; word-break: break-all; background: #0b0c10; padding: 10px; border-radius: 5px; border: 1px solid #333; }
        .btn { background: #00cc66; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .info { font-size: 11px; color: #8c91a0; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>SERVE PENE HUB</h1>
        <div style="color: #00ff88; font-size: 13px; font-weight: bold; margin-top: 5px;">¡Anuncios Completados!</div>
        
        <div class="key-box">
            <div style="font-size: 12px; color: #aaa; margin-bottom: 8px;">Tu Key Única Asignada:</div>
            <div class="key-text" id="assignedKey">Generando key...</div>
        </div>

        <button class="btn" onclick="copiarKey()">Copiar Key al Portapapeles</button>

        <div class="info">
            Protección activada: 1 key única por persona (Válida por 10 horas).
        </div>
    </div>

    <script>
        const masterKeys = [
            "X9mK-22pL-88qW", "Z7vB-44nT-11kM", "Q3wX-99aZ-55pL", "H8jN-33kK-77vC", "F2dL-66xX-44bN",
            "M5kP-11zZ-99wW", "T1qW-88mN-22bB", "K4xX-55vV-33cC", "L9zZ-22pP-66xX", "P6bB-77qQ-11mM",
            "V3nX-44kK-88zZ", "R8mN-11wW-55pP", "J2vV-99xX-77bB", "C7kK-33zZ-22qQ", "N5pP-66mM-44wW",
            "G1wW-55bB-88xX", "D4qQ-22vV-99kK", "B9zZ-77mM-11pP", "S6xX-11kK-33wW", "W2mN-88pP-55bB",
            "AX7-992-BNC", "ZX9-411-KLP", "QWE-778-ZZX", "POI-332-MNB", "LKJ-556-VCF",
            "HGF-884-XDS", "REW-119-QAZ", "TYU-663-WSX", "JKL-225-EDC", "VBN-447-RFV",
            "MKI-998-TGB", "OIK-774-YHN", "UYT-331-UJM", "TRE-552-IKL", "WQA-116-OPU",
            "ZXC-669-YTR", "ASD-883-REW", "FGH-227-QWE", "JKL-441-BNM", "BNM-995-VCX",
            "ALPHA-77-Z", "BETA-33-X", "GAMMA-88-C", "DELTA-11-V", "OMEGA-55-B",
            "VIP-99-K-44", "GOD-22-L-77", "PRO-66-M-11", "LUA-44-N-88", "HUB-33-P-22",
            "Xtreme-991-Z", "Ultra-442-X", "Master-773-C", "Elite-114-V", "GodMode-555-B",
            "FastKey-886-N", "Secure-227-M", "Random-668-Q", "Token-339-W", "Access-110-E",
            "SP-991A-ZX", "SP-882B-YX", "SP-773C-XW", "SP-664D-WV", "SP-555E-VU",
            "TX-1234-ZZ", "TX-2345-YY", "TX-3456-XX", "TX-4567-WW", "TX-5678-VV",
            "KR-5544-AA", "KR-6655-BB", "KR-7766-CC", "KR-8877-DD", "KR-9988-EE",
            "NX-1020-FF", "NX-3040-GG", "NX-5060-HH", "NX-7080-II", "NX-9010-JJ"
        ];

        window.onload = function() {
            const savedKey = localStorage.getItem("sph_user_assigned_key");
            const expireTime = parseInt(localStorage.getItem("sph_user_expire") || "0");
            const currentTime = Date.now();

            // Si ya tiene una key activa y no ha vencido, le muestra siempre la misma
            if (savedKey && expireTime && currentTime < expireTime) {
                document.getElementById("assignedKey").innerText = savedKey;
                return;
            }

            // Filtra las keys usadas en este navegador
            let usadas = JSON.parse(localStorage.getItem("sph_keys_usadas") || "[]");
            let disponibles = masterKeys.filter(k => !usadas.includes(k));
            let selectedKey = "";

            if (disponibles.length > 0) {
                const randomIndex = Math.floor(Math.random() * disponibles.length);
                selectedKey = disponibles[randomIndex];
            } else {
                selectedKey = "KEY-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.floor(Math.random() * 8999 + 1000);
            }

            usadas.push(selectedKey);
            localStorage.setItem("sph_keys_usadas", JSON.stringify(usadas));
            localStorage.setItem("sph_user_assigned_key", selectedKey);
            localStorage.setItem("sph_user_expire", currentTime + 36000000); // 10 horas

            document.getElementById("assignedKey").innerText = selectedKey;
        };

        function copiarKey() {
            const keyText = document.getElementById("assignedKey").innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert("¡Key copiada al portapapeles!");
            });
        }
    </script>
</body>
</html>
